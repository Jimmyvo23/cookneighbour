<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Pot Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b211c; --hero: #9e1f2a; --hero-ink: #fff8ee; --hero-ink-soft: #fff3dc;
    --saffron: #f2b632; --gold: #c99a2e; --cream: #fffdf8; --red: #9e1f2a;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--cream); color: var(--ink); font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; overflow-x: hidden; }
  .site-header { display: flex; align-items: center; gap: 16px; height: 76px; padding: 0 64px; background: var(--cream); border-bottom: 3px double var(--gold); }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 26px "Libre Caslon Text", serif; color: var(--red); text-decoration: none; }
  .site-header nav { margin-left: auto; display: flex; gap: 28px; }
  .site-header nav a { color: var(--red); font-size: 18px; text-underline-offset: 6px; }
  .hero { position: relative; height: calc(100vh - 76px); min-height: 640px; background: var(--hero); overflow: hidden; }
  canvas#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Soft shade behind the copy so it reads over any part of the cloth */
  .hero::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(90deg, rgb(70 8 16 / .55) 0%, rgb(70 8 16 / .25) 40%, transparent 62%); }
  .copy { position: relative; z-index: 2; max-width: 640px; padding: 96px 0 0 64px; color: var(--hero-ink); }
  .badge { display: inline-block; font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--hero-ink);
    border: 1.5px solid rgb(255 248 238 / .7); border-radius: 4px; padding: 5px 9px; }
  h1 { margin-top: 22px; font: 700 60px/1.08 "Libre Caslon Text", serif; text-wrap: balance; text-shadow: 0 2px 10px rgb(40 0 6 / .35); }
  .tagline { margin-top: 20px; font: italic 400 26px/1.35 "Libre Caslon Text", serif; color: var(--hero-ink-soft); max-width: 30ch; }
  .actions { margin-top: 34px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .btn-gold { font: 800 21px "Atkinson Hyperlegible Next", sans-serif; color: var(--ink); background: var(--saffron); border: 2.5px solid var(--ink);
    border-radius: 12px; padding: 16px 26px; text-decoration: none; box-shadow: 0 6px 14px rgb(40 0 6 / .35); }
  .cook { color: var(--hero-ink); font-weight: 700; font-size: 18px; text-underline-offset: 6px; }
  .fallback { display: none; }
  @media (max-width: 700px) {
    .site-header { padding: 0 16px; height: 64px; } .brand { font-size: 21px; } .site-header nav { gap: 16px; } .site-header nav a { font-size: 16px; }
    .hero { height: auto; min-height: calc(100svh - 64px); }
    .hero::before { background: linear-gradient(180deg, rgb(70 8 16 / .55) 0%, rgb(70 8 16 / .2) 50%, transparent 70%); }
    .copy { padding: 28px 16px 0; }
    h1 { font-size: 36px; } .tagline { font-size: 20px; }
    .actions { gap: 18px; } .btn-gold { width: 100%; text-align: center; }
    .hero { padding-bottom: 300px; }
  }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="#">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <path d="M12 9c-1.6-1.8 1.6-3.4 0-5.6M20 9c-1.6-1.8 1.6-3.4 0-5.6" fill="none" stroke="#c99a2e" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="4" y="12" width="26" height="4" rx="2" fill="#c99a2e"/>
      <path d="M6 16h22v8a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6Z" fill="#c8333b"/>
      <rect x="1" y="17" width="5" height="3" rx="1.5" fill="#7a1620"/><rect x="28" y="17" width="5" height="3" rx="1.5" fill="#7a1620"/>
    </svg>
    CookNeighbour
  </a>
  <nav><a href="#">Log in</a><a href="#">Sign up</a></nav>
</header>
<section class="hero">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="copy">
    <span class="badge">Prototype · nothing is real or charged</span>
    <h1>A home cook from your culture, in your kitchen or theirs.</h1>
    <p class="tagline">Home-cooked food from your own culture, made by a neighbour.</p>
    <div class="actions">
      <a class="btn-gold" href="#">Find a home cook</a>
      <a class="cook" href="#">I'm a home cook →</a>
    </div>
  </div>
</section>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const canvas = document.getElementById("scene");
const hero = canvas.parentElement;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const params = new URLSearchParams(location.search);
const fixedT = params.has("t") ? parseFloat(params.get("t")) : null; // for screenshots

let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch { canvas.remove(); throw new Error("No WebGL: keep the drawn fallback"); }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.9;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#9e1f2a");
scene.fog = new THREE.Fog("#9e1f2a", 18, 34);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

/* ---- Gingham tablecloth: the same three-tone weave as today's CSS, now a real surface ---- */
function ginghamTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "#9e1f2a"; g.fillRect(0, 0, 256, 256);
  g.fillStyle = "rgba(255,255,255,0.10)";
  for (let i = 0; i < 256; i += 64) { g.fillRect(i, 0, 32, 256); g.fillRect(0, i, 256, 32); }
  // faint weave
  g.fillStyle = "rgba(0,0,0,0.05)";
  for (let y = 0; y < 256; y += 2) g.fillRect(0, y, 256, 1);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(14, 14); t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const clothGeo = new THREE.PlaneGeometry(44, 44, 160, 160);
{ // soft fabric wrinkles, computed once
  const p = clothGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    const z = 0.05 * Math.sin(x * 0.9 + y * 0.35) + 0.035 * Math.sin(y * 1.7 - x * 0.4) + 0.12 * Math.exp(-((x + 6) ** 2 + (y - 2) ** 2) / 6) * Math.sin(x * 2.2);
    p.setZ(i, z);
  }
  clothGeo.computeVertexNormals();
}
const cloth = new THREE.Mesh(clothGeo, new THREE.MeshStandardMaterial({ map: ginghamTexture(), roughness: 0.92 }));
cloth.rotation.x = -Math.PI / 2; cloth.receiveShadow = true; scene.add(cloth);

/* ---- Plate ---- */
const table = new THREE.Group(); scene.add(table);
const plate = new THREE.Mesh(new THREE.CylinderGeometry(2.45, 2.2, 0.16, 96),
  new THREE.MeshPhysicalMaterial({ color: "#fff1cf", roughness: 0.35, clearcoat: 0.6 }));
plate.position.y = 0.08; plate.castShadow = plate.receiveShadow = true; table.add(plate);
const plateRim = new THREE.Mesh(new THREE.TorusGeometry(2.37, 0.05, 12, 128),
  new THREE.MeshStandardMaterial({ color: "#e2a829", metalness: 0.8, roughness: 0.3 }));
plateRim.rotation.x = Math.PI / 2; plateRim.position.y = 0.165; table.add(plateRim);

/* ---- Enamel pot ---- */
const enamel = new THREE.MeshPhysicalMaterial({ color: "#c8333b", roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.08, side: THREE.DoubleSide });
const darkEnamel = new THREE.MeshPhysicalMaterial({ color: "#7a1620", roughness: 0.4, clearcoat: 0.6 });
const gold = new THREE.MeshStandardMaterial({ color: "#e2a829", metalness: 0.9, roughness: 0.25 });

const pot = new THREE.Group(); pot.position.y = 0.16; table.add(pot);
const bodyProfile = [[0, 0], [1.25, 0], [1.55, 0.12], [1.72, 0.45], [1.78, 0.95], [1.76, 1.45], [1.7, 1.62], [1.64, 1.66]]
  .map(([r, y]) => new THREE.Vector2(r, y));
const body = new THREE.Mesh(new THREE.LatheGeometry(bodyProfile, 96), enamel);
body.castShadow = body.receiveShadow = true; pot.add(body);
function brothTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 512;
  const g = c.getContext("2d");
  const base = g.createRadialGradient(256, 256, 20, 256, 256, 256);
  base.addColorStop(0, "#d9862f"); base.addColorStop(1, "#8f4615");
  g.fillStyle = base; g.fillRect(0, 0, 512, 512);
  g.lineCap = "round";
  for (let i = 0; i < 5; i++) { // swirl lines of fat on the broth
    g.strokeStyle = `rgba(255,214,140,${0.35 - i * 0.04})`; g.lineWidth = 7 - i;
    g.beginPath();
    for (let a = 0; a < Math.PI * 3.2; a += 0.05) { const r = 30 + a * 22 + i * 9; g.lineTo(256 + Math.cos(a + i * 1.3) * r, 256 + Math.sin(a + i * 1.3) * r); }
    g.stroke();
  }
  for (let i = 0; i < 70; i++) { // green onion and herb bits
    const a = Math.random() * Math.PI * 2, r = Math.random() * 220;
    g.fillStyle = i % 3 ? "#5f9c3c" : "#9fcb6a";
    g.save(); g.translate(256 + Math.cos(a) * r, 256 + Math.sin(a) * r); g.rotate(Math.random() * 3);
    g.fillRect(-6, -3, 12, 6); g.restore();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const broth = new THREE.Mesh(new THREE.CircleGeometry(1.66, 72),
  new THREE.MeshPhysicalMaterial({ map: brothTexture(), roughness: 0.15, clearcoat: 0.8 }));
broth.rotation.x = -Math.PI / 2; broth.position.y = 1.32; pot.add(broth);
const band = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.07, 16, 128), gold);
band.rotation.x = Math.PI / 2; band.position.y = 1.62; pot.add(band);
for (const s of [-1, 1]) {
  const h = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.085, 16, 40, Math.PI), darkEnamel);
  h.position.set(s * 1.82, 1.25, 0); h.rotation.set(0, s > 0 ? -Math.PI / 2 : Math.PI / 2, -Math.PI / 2);
  h.rotation.z = s * Math.PI / 2 * -1; h.castShadow = true; pot.add(h);
}

/* Lid: comes off, leans against the pot, goes back on */
const lid = new THREE.Group(); lid.position.set(0, 1.66, 0); pot.add(lid);
const lidProfile = [[0, 0.48], [0.5, 0.46], [1.05, 0.36], [1.5, 0.16], [1.74, 0.03], [1.76, 0]].map(([r, y]) => new THREE.Vector2(r, y));
const lidMesh = new THREE.Mesh(new THREE.LatheGeometry(lidProfile, 96), enamel);
lidMesh.castShadow = true; lid.add(lidMesh);
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 16), gold); knob.position.y = 0.62; knob.castShadow = true; lid.add(knob);
const knobStem = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.16, 16), gold); knobStem.position.y = 0.5; lid.add(knobStem);

/* ---- Wooden spoon resting on the cloth ---- */
const wood = new THREE.MeshStandardMaterial({ color: "#d9a066", roughness: 0.7 });
const spoon = new THREE.Group(); // origin = centre of the spoon bowl; handle points up (+y)
const handle = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 3.4, 6, 16), wood);
handle.position.y = 2.05; handle.castShadow = true; spoon.add(handle);
const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 16), wood);
bowl.scale.set(0.85, 1.25, 0.28); bowl.castShadow = true; spoon.add(bowl);
pot.add(spoon);
const SPOON_REST = { pos: new THREE.Vector3(-0.6, -0.04, 3.1), quat: new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0.02, 0.45).normalize()) };
const SPOON_STIR_QUAT = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.18, 0, -0.32));
function stirPos(theta) { return new THREE.Vector3(Math.cos(theta) * 0.75, 1.05, Math.sin(theta) * 0.6); }

/* ---- Steam: soft sprites that rise, swell and fade ---- */
function puffTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, "rgba(255,250,240,0.9)"); grd.addColorStop(0.4, "rgba(255,248,236,0.35)"); grd.addColorStop(1, "rgba(255,248,236,0)");
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const puffTex = puffTexture();
const puffs = [];
for (let i = 0; i < 90; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, transparent: true, depthWrite: false, opacity: 0 }));
  s.userData.life = -1; pot.add(s); puffs.push(s);
}
function emit(n, strength) {
  for (const s of puffs) {
    if (n <= 0) break;
    if (s.userData.life >= 0) continue;
    const a = Math.random() * Math.PI * 2, r = Math.random() * 1.3;
    s.position.set(Math.cos(a) * r, 1.4 + Math.random() * 0.3, Math.sin(a) * r);
    s.userData = { life: 0, max: 2.4 + Math.random() * 1.8, vx: (Math.random() - 0.4) * 0.3, vy: 1.0 + Math.random() * 0.8 * strength, size: 0.5 + Math.random() * 0.6, peak: 0.2 * strength };
    n--;
  }
}
function updatePuffs(dt) {
  for (const s of puffs) {
    const u = s.userData; if (u.life < 0) continue;
    u.life += dt; const k = u.life / u.max;
    if (k >= 1) { u.life = -1; s.material.opacity = 0; continue; }
    s.position.x += u.vx * dt; s.position.y += u.vy * dt * (1 - k * 0.5);
    const sz = u.size * (1 + k * 3.4); s.scale.set(sz, sz, 1);
    s.material.opacity = u.peak * Math.sin(Math.PI * Math.min(1, k * 1.15));
  }
}

/* ---- Light: a warm kitchen window from the upper left ---- */
scene.add(new THREE.HemisphereLight(0xfff1dd, 0x5a1a1a, 0.35));
const key = new THREE.DirectionalLight(0xffe2bd, 1.9);
key.position.set(-7, 11, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xffc98a, 0.9); rim.position.set(6, 5, -7); scene.add(rim);

/* ---- Layout: pot on the right on wide screens, below the copy on phones ---- */
let narrow = false;
function layout() {
  const w = hero.clientWidth, h = hero.clientHeight;
  narrow = w < 700;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (narrow) { camera.fov = 34; table.position.set(0, 0, 0); camera.position.set(0, 6.2, 16); camera.lookAt(0, 3.9, 0); }
  else { camera.fov = 28; table.position.set(3.4, 0, 0); camera.position.set(0.6, 5.2, 15); camera.lookAt(1.5, 1.5, 0); }
  camera.updateProjectionMatrix();
}
addEventListener("resize", layout); layout();

/* ---- Motion: lid off, spoon stirs, steam goes up, all put back; 2 runs then rest ---- */
const CYCLE = 10, CYCLES = 2;
const ease = (k) => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
const seg = (t, a, b) => ease((t - a) / (b - a));
const LID_ON = { p: new THREE.Vector3(0, 1.66, 0), r: 0 };
const LID_UP = { p: new THREE.Vector3(0, 3.0, 0), r: 0.12 };
const LID_ASIDE = { p: new THREE.Vector3(2.1, 0.95, -1.1), r: -1.15 };
function lidPose(t) {
  const lerp = (A, B, k) => { lid.position.lerpVectors(A.p, B.p, k); lid.rotation.z = A.r + (B.r - A.r) * k; };
  if (t < 0.8) return lerp(LID_ON, LID_ON, 0);
  if (t < 1.3) return lerp(LID_ON, LID_UP, seg(t, 0.8, 1.3));
  if (t < 1.9) return lerp(LID_UP, LID_ASIDE, seg(t, 1.3, 1.9));
  if (t < 7.3) return lerp(LID_ASIDE, LID_ASIDE, 0);
  if (t < 7.9) return lerp(LID_ASIDE, LID_UP, seg(t, 7.3, 7.9));
  if (t < 8.3) { lerp(LID_UP, LID_ON, seg(t, 7.9, 8.3)); return; }
  const k = t - 8.3; lerp(LID_ON, LID_ON, 0); lid.position.y += 0.06 * Math.exp(-k * 7) * Math.abs(Math.sin(k * 22)); // clink
}
const STIR_A = 2.6, STIR_B = 6.4;
function spoonPose(t) {
  const arc = (A, B, k, qa, qb) => { spoon.position.lerpVectors(A, B, k); spoon.position.y += Math.sin(Math.PI * k) * 2.2; spoon.quaternion.slerpQuaternions(qa, qb, k); };
  if (t < 1.8 || t >= 7.2) { spoon.position.copy(SPOON_REST.pos); spoon.quaternion.copy(SPOON_REST.quat); return 0; }
  if (t < STIR_A) { arc(SPOON_REST.pos, stirPos(0), seg(t, 1.8, STIR_A), SPOON_REST.quat, SPOON_STIR_QUAT); return 0; }
  if (t < STIR_B) { const th = (t - STIR_A) * Math.PI * 2 / 1.5; spoon.position.copy(stirPos(th)); spoon.quaternion.copy(SPOON_STIR_QUAT); return th; }
  arc(stirPos((STIR_B - STIR_A) * Math.PI * 2 / 1.5), SPOON_REST.pos, seg(t, STIR_B, 7.2), SPOON_STIR_QUAT, SPOON_REST.quat); return 0;
}
const pointer = { x: 0, y: 0 }, spin = { y: 0, x: 0 };
addEventListener("pointermove", (e) => { pointer.x = e.clientX / innerWidth - 0.5; pointer.y = e.clientY / innerHeight - 0.5; });

let steamDebt = 0;
let visible = true, start = performance.now(), last = start, lastCycle = -1;
new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible) loop(); }).observe(hero);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loop(); });

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = (now - start) / 1000;
  const active = !reduced && t < CYCLE * CYCLES;
  const cycleT = active ? t % CYCLE : 0;
  const cycle = Math.floor(t / CYCLE);
  lidPose(active ? cycleT : 0);
  const th = spoonPose(active ? cycleT : 0);
  if (th) broth.rotation.z = -th * 0.35; // the broth swirls after the spoon
  if (active && cycle !== lastCycle && cycleT > 1.0) { lastCycle = cycle; emit(8, 1); }
  const open = active && cycleT > 1.0 && cycleT < 7.6;
  const stirring = active && cycleT > STIR_A && cycleT < STIR_B;
  steamDebt += open ? dt * (stirring ? 16 : 6) : 0; // puffs per second
  while (steamDebt >= 1) { emit(1, stirring ? 1.15 : 0.8); steamDebt -= 1; }
  updatePuffs(dt);
  // pot turns toward the pointer, with a slow spring
  const ty = reduced ? 0 : pointer.x * 0.55 + (active ? Math.sin(t * 0.6) * 0.06 : 0);
  const tx = reduced ? 0 : pointer.y * 0.08;
  spin.y += (ty - spin.y) * Math.min(1, dt * 3); spin.x += (tx - spin.x) * Math.min(1, dt * 3);
  pot.rotation.y = spin.y - 0.35; pot.rotation.x = spin.x;
  renderer.render(scene, camera);
  const puffing = puffs.some((s) => s.userData.life >= 0);
  return active || puffing || Math.abs(ty - spin.y) > 0.001;
}
let raf = 0;
function loop() {
  cancelAnimationFrame(raf);
  if (fixedT !== null) { start = performance.now() - fixedT * 1000; for (let i = 0; i < 60; i++) frame(start + fixedT * 1000 - (60 - i) * 16); return; }
  const tick = (now) => { if (!visible || document.hidden) return; if (frame(now)) raf = requestAnimationFrame(tick); else raf = 0; };
  raf = requestAnimationFrame(tick);
}
addEventListener("pointermove", () => { if (!raf && visible) loop(); });
loop();
window.__ready = true;
</script>
</body>
</html>
