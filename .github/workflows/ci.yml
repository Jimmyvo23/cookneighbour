name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# T-084: one 21 to 24.5 minute job was close to the 25 minute limit. It is now three jobs that
# run at the same time, plus a tiny gate job named `ci`. No test was removed, no limit raised.
jobs:
  # Lint, types, formatting, unit tests and build. No Supabase needed.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: exit 1 # TEMP-GATE-PROOF
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build

  # Everything that needs the throwaway local Supabase stack.
  supabase:
    name: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: exit 1 # TEMP-GATE-PROOF
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Throwaway local Supabase on the runner. Keys are public local defaults, no repo secrets.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      # T-027: RLS tests against the throwaway local stack. URL and keys are the public local
      # defaults printed by the CLI (never repo secrets).
      - name: RLS tests
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          npm run test:rls

      # T-028: API route tests call the Route Handlers directly against the same local stack.
      - name: API route tests
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          npm run test:api

      # T-030: seed the throwaway local stack, then check the result. Runs after the RLS tests so
      # the seed accounts cannot collide with their fixtures. The admin password is a local-only
      # throwaway for this runner (not a secret, never used outside this job).
      - name: Seed demo data and verify
        env:
          SEED_ADMIN_PASSWORD: ci-throwaway-admin-password-local-only
        run: |
          npm run db:seed -- --local
          npm run db:seed -- --local   # second run proves it is idempotent
          npm run db:seed -- --local --verify

      - run: npx playwright install --with-deps chromium
      # T-057: e2e against the REAL routes. The app is started by Playwright with the local
      # Supabase URL and keys from `supabase status` (public local defaults, never repo secrets),
      # a throwaway HASH_PEPPER set in playwright.config.ts, and NEXT_PUBLIC_API_MOCK blank.
      - name: Playwright e2e (real routes) and smoke test
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          npm run test:e2e

      - name: Upload Playwright report (real routes)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # MOCK-mode UI tests (NEXT_PUBLIC_API_MOCK=1, no Supabase involved).
  e2e-mock:
    name: e2e-mock
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e (mock mode)
        run: npm run test:e2e:mock

      - name: Upload Playwright report (mock mode)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mock
          path: |
            playwright-report/
            test-results-mock/
          if-no-files-found: ignore
          retention-days: 7

  # Gate job. The job id and name must stay exactly `ci`: branch protection requires a check with
  # this name. `if: always()` makes it run even when a needed job failed or was skipped or
  # cancelled; without it a skipped gate would count as passed. It fails unless all three succeeded.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [checks, supabase, e2e-mock]
    if: always()
    steps:
      - name: All jobs must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "A needed job did not succeed ($r)."
              exit 1
            fi
          done
