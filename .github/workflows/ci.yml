name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# T-084: one 21 to 24.5 minute job was close to the 25 minute limit. It is now three jobs that
# run at the same time, plus a tiny gate job named `ci`. No test was removed, no limit raised.
# T-108: the `supabase` and `e2e-mock` job limits are now 35 minutes (slow apt mirror made the Playwright install
# take 9 to 10+ minutes).
# T-110: Playwright runs in the official `mcr.microsoft.com/playwright` image (browsers and system libraries are
# already inside), so nothing is downloaded with apt. The image tag must equal the locked @playwright/test version;
# a step in each job fails the run if package-lock.json and the tag disagree. To upgrade Playwright, change the
# tag in the two places marked PLAYWRIGHT_IMAGE together with package-lock.json. ubuntu-latest is Ubuntu 24.04 = noble.
env:
  # PLAYWRIGHT_IMAGE (1 of 2): used by the `supabase` job. The `e2e-mock` job repeats the tag in `container.image`
  # because the `env` context is not allowed there. Both are checked against package-lock.json.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble

jobs:
  # Lint, types, formatting, unit tests and build. No Supabase needed.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build

  # Everything that needs the throwaway local Supabase stack.
  supabase:
    name: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Check the Playwright image tag matches package-lock.json
        env:
          IMAGE_TAG: ${{ env.PLAYWRIGHT_IMAGE }}
        run: |
          v="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          test -n "$v" || { echo "::error::could not read @playwright/test version"; exit 1; }
          case "$IMAGE_TAG" in
            *":v$v-"*) ;;
            *) echo "::error::env.PLAYWRIGHT_IMAGE ($IMAGE_TAG) does not match locked @playwright/test $v. Update ci.yml."; exit 1 ;;
          esac
          # The e2e-mock container.image line is a second copy of the tag; it must be identical.
          copy="$(sed -n 's/^ *image: *\(mcr\.microsoft\.com\/playwright:[^ ]*\) *$/\1/p' .github/workflows/ci.yml)"
          if [ "$copy" != "$IMAGE_TAG" ]; then
            echo "::error::container.image in ci.yml ('$copy') differs from env.PLAYWRIGHT_IMAGE ($IMAGE_TAG). Change both."; exit 1
          fi
          echo "Playwright $v matches $IMAGE_TAG in both places"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Throwaway local Supabase on the runner. Keys are public local defaults, no repo secrets.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      # T-027: RLS tests against the throwaway local stack. URL and keys are the public local
      # defaults printed by the CLI (never repo secrets).
      - name: RLS tests
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          npm run test:rls

      # T-028: API route tests call the Route Handlers directly against the same local stack.
      - name: API route tests
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          npm run test:api

      # T-030: seed the throwaway local stack, then check the result. Runs after the RLS tests so
      # the seed accounts cannot collide with their fixtures. The admin password is a local-only
      # throwaway for this runner (not a secret, never used outside this job).
      - name: Seed demo data and verify
        env:
          SEED_ADMIN_PASSWORD: ci-throwaway-admin-password-local-only
        run: |
          npm run db:seed -- --local
          npm run db:seed -- --local   # second run proves it is idempotent
          npm run db:seed -- --local --verify

      # T-057: e2e against the REAL routes. The app is started by Playwright (inside the official image,
      # on the host network so it reaches the local Supabase on 127.0.0.1) with the local Supabase URL and
      # keys from `supabase status` (public local defaults, never repo secrets), a throwaway HASH_PEPPER
      # set in playwright.config.ts, and NEXT_PUBLIC_API_MOCK blank. Runs as the runner user so files
      # written to the workspace (.next, reports) stay owned by it.
      - name: Playwright e2e (real routes) and smoke test
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          docker run --rm --network host --ipc=host --init \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -e API_URL -e ANON_KEY -e SERVICE_ROLE_KEY -e PUBLISHABLE_KEY -e SECRET_KEY \
            -v "$PWD":/work -w /work "$PLAYWRIGHT_IMAGE" \
            npm run test:e2e

      - name: Upload Playwright report (real routes)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # MOCK-mode UI tests (NEXT_PUBLIC_API_MOCK=1, no Supabase involved).
  e2e-mock:
    name: e2e-mock
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      # PLAYWRIGHT_IMAGE (2 of 2): must equal the env value above.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Non-root user 1001 = the runner's uid, so the checkout is writable; --ipc=host for Chromium.
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@v5

      - name: Check the Playwright image tag matches package-lock.json
        env:
          IMAGE_TAG: ${{ env.PLAYWRIGHT_IMAGE }}
        run: |
          v="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          test -n "$v" || { echo "::error::could not read @playwright/test version"; exit 1; }
          case "$IMAGE_TAG" in
            *":v$v-"*) ;;
            *) echo "::error::env.PLAYWRIGHT_IMAGE ($IMAGE_TAG) does not match locked @playwright/test $v. Update ci.yml."; exit 1 ;;
          esac
          # The e2e-mock container.image line is a second copy of the tag; it must be identical.
          copy="$(sed -n 's/^ *image: *\(mcr\.microsoft\.com\/playwright:[^ ]*\) *$/\1/p' .github/workflows/ci.yml)"
          if [ "$copy" != "$IMAGE_TAG" ]; then
            echo "::error::container.image in ci.yml ('$copy') differs from env.PLAYWRIGHT_IMAGE ($IMAGE_TAG). Change both."; exit 1
          fi
          echo "Playwright $v matches $IMAGE_TAG in both places"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Playwright e2e (mock mode)
        run: npm run test:e2e:mock

      - name: Upload Playwright report (mock mode)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mock
          path: |
            playwright-report/
            test-results-mock/
          if-no-files-found: ignore
          retention-days: 7

  # Gate job. The job id and name must stay exactly `ci`: branch protection requires a check with
  # this name. `if: always()` makes it run even when a needed job failed or was skipped or
  # cancelled; without it a skipped gate would count as passed. It fails unless all three succeeded.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [checks, supabase, e2e-mock]
    if: always()
    # The gate only reads the other jobs' results (a few seconds), so 5 minutes is generous;
    # a hung runner then fails fast instead of holding the required check for 6 hours (T-087).
    timeout-minutes: 5
    steps:
      - name: All jobs must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "A needed job did not succeed ($r)."
              exit 1
            fi
          done
